project_name: "Aether Social Analytics Hub API"
version: "0.0.1"

cors:
  - "http://localhost:5173"

databases:
  db_type: "postgresql"
  postgres:
    host: "localhost"
    port: 5432
    username: ""
    password: ""
    schema: "dydanmaku"

logging:
  level: "INFO"
  format: "[<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green>] [{level}] <level>{message}</level>"
  rotation: "00:00"
  serialize: false
  dir_path: "./logs/"
  enable_console: true
  enable_file: true

messaging:
  virtual_host: "/"
  exchange: "mc_event_bus"
  queue: "Danmaku"

cache:
  ssl: false

otel_service_name: "aether-social-analytics-hub-api"