# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# max_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# databases to include when performing an upgrade or downgrade
# command on multiple engines.
# include_databases = 

# set to 'true' to indicate that revision files should include
# code to produce deterministic migrations for anonymous constraints.
# this defaults to false as it is not supported on all databases.
# deterministic_constraint_names = false

# set to 'true' to indicate that revision files should include
# code to produce SOFT-DELETION of constraints, which means that
# ALTER COLUMN operations will not attempt to drop constraints that
# are not named, since some databases (Oracle) will drop the constraint
# automatically when the column is dropped.
# soft_deletes_for_drops = false

# the SQL standard requires that a quoted identifier name be folded to
# uppercase before comparison, which means that for some databases, a
# migration that would alter a name like "MyColumn" to "mycolumn" would
# be considered a no-op.  Setting this to True will cause comparison
# operations to be case sensitive.  The flag affects both the default
# compare_type and compare_server_default implementations as well as
# those provided by sqlalchemy itself.  Custom compare functions would
# need to make use of this flag explicitly.
# case_sensitive = false

# transaction strategy to use when running upgrade/downgrade operations
# either 'default' or 'batch'; the 'batch' mode is recommended for
# databases such as SQLite which do not support online ALTER COLUMN
# see https://alembic.sqlalchemy.org/en/latest/batch.html
# transaction_strategy = default

# The default symbol used to indicate that a particular revision does not
# have a parent revision.  This is normally zero revision ids, i.e.
# "000000000000" or "00000000000000000000000000000000".
# down_revision = 000000000000

# character encoding to use when writing migration files
# encoding = utf-8

#sqlalchemy.url = sqlite:///../danmaku.db
sqlalchemy.url = postgresql+psycopg://postgres:Pass123$@127.0.0.1:5432/dydanmakudb?options=-csearch_path=dydanmaku


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S