<div class="profile-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <h1>User Profile</h1>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="profile-info">
        <mat-list>
          <mat-list-item>
            <mat-icon matListItemIcon>person</mat-icon>
            <div matListItemTitle>Username</div>
            <div matListItemLine>{{ userProfile?.username }}</div>
          </mat-list-item>
          <mat-list-item>
            <mat-icon matListItemIcon>badge</mat-icon>
            <div matListItemTitle>Nickname</div>
            <div matListItemLine>{{ userProfile?.nickname }}</div>
          </mat-list-item>
          <mat-list-item>
            <mat-icon matListItemIcon>security</mat-icon>
            <div matListItemTitle>Roles</div>
            <div matListItemLine>
              @for (role of userProfile?.roles; track role) {
                <mat-chip>{{ role.name }}</mat-chip>
              }
            </div>
          </mat-list-item>
        </mat-list>
      </div>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        Logout
      </button>
    </mat-card-actions>
  </mat-card>
</div>
