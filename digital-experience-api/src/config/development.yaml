NODE_ENV: Development
APP_VERSION: '0.0.1'
HTTP_PORT: 3000

database:
  synchronize: false
  logging: false
  encrypt: true
  timeout: 30000
  schema: 'bookstore'

keycloak:
  realm: aether
  authServerUrl: http://localhost:8080
  clientId: bookstoreapi
  clientSecret:
  scopes:
    profile: 'User profile information'
    email: 'User email address'
    openid: 'OpenID Connect scope'
    roles: 'User roles'

cache:
  db: 0
  ssl: true
  tls:
    rejectUnauth: false

messaging:
  excchange: 'mc_event_bus'
  queue: 'Bookstore'
  virtual_host: '/'
