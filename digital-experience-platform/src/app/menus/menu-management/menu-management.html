<div class="menu-management-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <h1>Menu Management</h1>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="toolbar">
        <button mat-raised-button color="primary" (click)="openAddMenuDialog()">
          <mat-icon>add</mat-icon>
          Add Menu
        </button>
      </div>

      <div class="table-container">
        <table mat-table [dataSource]="menus" class="menus-table">
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let menu">{{ menu.name }}</td>
          </ng-container>

          <!-- Title Column -->
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let menu">{{ menu.title }}</td>
          </ng-container>

          <!-- Icon Column -->
          <ng-container matColumnDef="icon">
            <th mat-header-cell *matHeaderCellDef>Icon</th>
            <td mat-cell *matCellDef="let menu">
              <mat-icon>{{ menu.icon }}</mat-icon>
            </td>
          </ng-container>

          <!-- Route Column -->
          <ng-container matColumnDef="route">
            <th mat-header-cell *matHeaderCellDef>Route</th>
            <td mat-cell *matCellDef="let menu">{{ menu.route }}</td>
          </ng-container>

          <!-- Order Column -->
          <ng-container matColumnDef="order">
            <th mat-header-cell *matHeaderCellDef>Order</th>
            <td mat-cell *matCellDef="let menu">{{ menu.order }}</td>
          </ng-container>

          <!-- Roles Column -->
          <ng-container matColumnDef="roles">
            <th mat-header-cell *matHeaderCellDef>Roles</th>
            <td mat-cell *matCellDef="let menu">
              <mat-chip-listbox>
                @for (role of menu.roles; track role) {
                <mat-chip-option disabled>{{ role.name }}</mat-chip-option>
                }
              </mat-chip-listbox>
            </td>
          </ng-container>

          <!-- Active Column -->
          <ng-container matColumnDef="isActive">
            <th mat-header-cell *matHeaderCellDef>Active</th>
            <td mat-cell *matCellDef="let menu">
              <mat-checkbox
                [checked]="menu.isActive"
                (change)="toggleMenu(menu.id, $event.checked)"
              ></mat-checkbox>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let menu">
              <button mat-icon-button color="primary" (click)="openEditMenuDialog(menu)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteMenu(menu)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator
          [length]="totalMenus"
          [pageIndex]="currentPage"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons="true"
          (page)="onPageChange($event)"
          aria-label="Select page"
        >
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
