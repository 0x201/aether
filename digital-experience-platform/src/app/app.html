<mat-toolbar color="primary">
  <div class="toolbar-left">
    <button mat-icon-button (click)="isSidenavOpened = !isSidenavOpened">
      <mat-icon>menu</mat-icon>
    </button>
    <span>Bookstore App</span>
  </div>

  <div class="toolbar-right">
    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item routerLink="/users/profile">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    [(opened)]="isSidenavOpened"
    mode="side"
    fixedInViewport="false"
    class="app-sidenav"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
  >
    <div class="sidenav-scroll-wrapper">
      <cdk-virtual-scroll-viewport
        itemSize="50"
        minBufferPx="200"
        maxBufferPx="400"
        class="viewport"
      >
        <mat-nav-list>
          <recursive-menu *cdkVirtualFor="let menu of menus" [menu]="menu" [level]="0">
          </recursive-menu>
        </mat-nav-list>
      </cdk-virtual-scroll-viewport>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
