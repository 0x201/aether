project_name: "Douyu Danmaku Analytics API"
version: "0.0.1"

cors:
  - "http://localhost:5173"

databases:
  active_database: "postgres"
  sqlserver:
    type: "sqlserver"
    server: "127.0.0.1"
    port: 14330
    trusted_connection: false
    username: "sa"
    password: "Pass123$"
    database: "dydanmakudb"
  
  sqlite:
    type: "sqlite"
    sqlite_path: "../danmaku.db"

  postgres:
    host: "localhost"
