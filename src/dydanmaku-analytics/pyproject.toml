[project]
name = "dydamuku-analytics"
version = "0.1.0"
description = "Douyu Danmaku Analytics Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jieba3>=1.0.2",
    "fastapi[standard]>=0.123.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.4",
    "sqlalchemy>=2.0.44",
    "pyyaml>=6.0.3",
    "apscheduler>=3.10.4",
    "pydantic-settings>=2.12.0",
    "loguru>=0.7.3",
    "psycopg[binary,pool]>=3.3.2",
]

[dependency-groups]
dev = [
    "alembic>=1.17.2",
    "black>=25.11.0",
    "coverage>=7.13.0",
    "pytest>=9.0.1",
    "pytest-mock>=3.15.1",
    "scalar-fastapi>=1.6.1",
]

[[tool.uv.index]]
#url="https://pypi.tuna.tsinghua.edu.cn/simple"
url="https://mirrors.aliyun.com/pypi/simple/"
default=true
