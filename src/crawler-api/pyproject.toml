[project]
name = "fastapi-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.13.5",
    "coverage>=7.10.7",
    "fastapi>=0.116.1",
    "pyjwt>=2.10.1",
    "pymssql>=2.3.7",
    "python-dotenv>=1.1.1",
    "python-keycloak>=4.7.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "alembic>=1.16.5",
    "black>=25.1.0",
    "coverage>=7.10.6",
    "playwright>=1.55.0",
    "pytest>=8.4.1",
    "scalar-fastapi>=1.4.2",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true