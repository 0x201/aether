database:
  server: "localhost"
  port: 1433
  trusted_connection: true
  authentication: ""
  username: "username"
  password: "YourStrongPassword"
  database: "Database Name"

pwd_salt: "salt"

jwt:
  secret: "secret"
  expire_minutes: 120

cors:
  cors_allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  cors_allow_methods:
    - "get"
    - "post"
    - "put"
    - "delete"
    - "options"

api:
  api_version: "v1"
  api_prefix: "/api"
  port: 8000
  host: "localhost"

nppa:
  base_url: "https://www.nppa.gov.cn/bsfw/jggs/yxspjg"
  data_url: "/index"
  suffix: ".html"