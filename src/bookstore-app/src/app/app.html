<div class="main-container">
  <mat-toolbar color="primary" class="bookstore-toolbar">
    <button mat-icon-button (click)="toggleSidenav()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>Bookstore App</span>
    <span class="spacer"></span>
    <button mat-button routerLink="/home">
      <mat-icon>home</mat-icon>
      Home
    </button>
    <button mat-button routerLink="/books">
      <mat-icon>menu_book</mat-icon>
      Books
    </button>
    <button mat-button routerLink="/admin/books">
      <mat-icon>manage_accounts</mat-icon>
      Admin
    </button>
    <button mat-icon-button (click)="logout()">
      <mat-icon>exit_to_app</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav [mode]="(isHandset$ | async) ? 'over' : 'side'" 
                 [opened]="!(isHandset$ | async)"
                 fixedInViewport="false"
                 class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/home" (click)="sidenav.close()" routerLinkActive="active-link">
          <mat-icon>home</mat-icon>
          Home
        </a>
        <a mat-list-item routerLink="/books" (click)="sidenav.close()" routerLinkActive="active-link">
          <mat-icon>menu_book</mat-icon>
          Browse Books
        </a>
        <a mat-list-item routerLink="/admin/books" (click)="sidenav.close()" routerLinkActive="active-link">
          <mat-icon>manage_accounts</mat-icon>
          Book Management
        </a>
        <mat-divider></mat-divider>
        <a mat-list-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          Logout
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="sidenav-content">
      <div class="bookstore-container">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
