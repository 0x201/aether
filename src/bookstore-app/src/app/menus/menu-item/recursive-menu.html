<mat-list-item>
  <div class="menu-content" [style.padding-left.px]="level * 16">
    @if (hasChildren) {
      <button mat-icon-button (click)="toggleChildren()" aria-label="Toggle children">
        <mat-icon>{{ isExpanded ? 'expand_more' : 'chevron_right' }}</mat-icon>
      </button>
    } @else {
      <span class="icon-placeholder"></span>
    }

    <a
      mat-list-item
      [routerLink]="menu.route ? menu.route : null"
      routerLinkActive="active-menu"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="!menu.route && hasChildren ? toggleChildren() : null"
      class="menu-link"
    >
      @if (menu.icon) {
        <mat-icon matListItemIcon>{{ menu.icon }}</mat-icon>
      }
      <span matListItemTitle>{{ menu.title }}</span>
    </a>
  </div>
</mat-list-item>

@if (hasChildren && isExpanded) {
  <mat-list>
    @for (child of menu.children; track child.id) {
      <recursive-menu
        [menu]="child"
        [level]="level + 1">
      </recursive-menu>
    }
  </mat-list>
}
